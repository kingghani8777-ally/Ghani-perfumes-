<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghani Perfume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.tagline {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .product-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        .product-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            width: 210px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-card h3 {
            margin: 12px 0 5px 0;
            color: #333;
            font-size: 16px;
        }
        .price {
            color: #27ae60;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .buy-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .buy-btn:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

    <h1>Ghani Perfume Collection</h1>
    <p class="tagline">Experience the luxury of pure fragrances</p>

    <div class="product-grid">
        
        <!-- Product 1: Royal Oud -->
        <div class="product-card">
            <img src="images/royal-oud.jpg" alt="Royal Oud">
            <h3>Royal Oud</h3>
            <p class="price">Rs. 3,000</p>
            <button class="buy-btn">Order Now</button>
        </div>

        <!-- Product 2: Jannat-ul-Ferdoos -->
        <div class="product-card">
            <img src="images/jannat-ul-ferdoos.jpg" alt="Jannat-ul-Ferdoos">
            <h3>Jannat-ul-Ferdoos</h3>
            <p class="price">Rs. 1,500</p>
            <button class="buy-btn">Order Now</button>
        </div>

        <!-- Product 3: Musk Al Oud -->
        <div class="product-card">
            <img src="images/musk-al-oud.jpg" alt="Musk Al Oud">
            <h3>Musk Al Oud</h3>
            <p class="price">Rs. 2,200</p>
            <button class="buy-btn">Order Now</button>
        </div>

        <!-- Product 4: Velvet Oud -->
        <div class="product-card">
            <img src="images/velvet-oud.jpg" alt="Velvet Oud">
            <h3>Velvet Oud</h3>
            <p class="price">Rs. 2,800</p>
            <button class="buy-btn">Order Now</button>
        </div>

    </div>

</body>
</html>
